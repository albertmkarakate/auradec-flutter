name: auradec_flutter
description: AURADEC — Sound for every culture.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Audio (ExoPlayer on Android, Namida-style) ────────────────────
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.14

  # MediaStore queried via embedded Kotlin MethodChannel (Namida pattern)

  # ── Filesystem & permissions ─────────────────────────────────────
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  file_picker: ^8.0.7

  # ── Metadata extraction (via on_audio_query MediaStore — no extra pkg needed) ─

  # ── Persistence ───────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── State management (GetX like Namida) ───────────────────────────
  get: ^4.6.6

  # ── UI helpers ────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  audio_video_progress_bar: ^2.0.1
  palette_generator: ^0.3.3+3
  google_fonts: ^6.2.1

  # ── Utilities ─────────────────────────────────────────────────────
  collection: ^1.18.0
  intl: ^0.19.0
  rxdart: ^0.28.0
  http: ^1.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
